# Delivery harness: Claude Code takes a prioritized issue through
#   triagem → planejamento → [aprovação do plano] → implementacao → verificacao → [revisão]
# The state lives on the issue (panel comment + `harness:*` label). Each run
# executes at most one stage, checks its exit conditions, records the result on
# the issue and dispatches itself again while the next state is automatic. Human
# decisions are comments on the issue: /aprovar, /revisar <texto>, /retomar, /cancelar.
# Docs: scripts/delivery-harness/README.md
name: Delivery harness

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to advance"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write # dispatch the next stage

env:
  HARNESS_MAX_ATTEMPTS: ${{ vars.HARNESS_MAX_ATTEMPTS || '2' }}
  HARNESS_MAX_CHANGED_LINES: ${{ vars.HARNESS_MAX_CHANGED_LINES || '500' }}
  HARNESS_MAX_CHANGED_FILES: ${{ vars.HARNESS_MAX_CHANGED_FILES || '10' }}
  HARNESS_AMBIGUITY_SAMPLES: ${{ vars.HARNESS_AMBIGUITY_SAMPLES || '3' }}
  HARNESS_MODEL: ${{ vars.HARNESS_MODEL }}
  HARNESS_MAX_BUDGET_USD: ${{ vars.HARNESS_MAX_BUDGET_USD }}
  BASE_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  harness:
    # Only the trigger label, slash-commands on issues (not PRs) and dispatches wake the harness.
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'priorizado') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && startsWith(github.event.comment.body, '/')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # One run per issue at a time; never cancel a stage halfway.
    concurrency:
      group: delivery-harness-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: false
    # GitHub credentials are passed per step, only to harness-owned steps —
    # never to steps that run code from the agent branch (dependency install).
    env:
      STATE_DIR: ${{ github.workspace }}/.harness/state
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          # No credentials in .git/config: the agent can't push; the stage script pushes explicitly.
          persist-credentials: false

      - name: Snapshot trusted harness tooling
        run: |
          echo "HARNESS_HOME=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/harness/scripts" "$RUNNER_TEMP/harness/.claude/skills"
          cp -r scripts/delivery-harness scripts/issue-ambiguity scripts/pr-autoapproval "$RUNNER_TEMP/harness/scripts/"
          cp -r .claude/skills/resolve-issue "$RUNNER_TEMP/harness/.claude/skills/"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Route (read state, apply decision, pick the stage)
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$HARNESS_HOME/scripts/delivery-harness/route.mjs" --out-dir "$STATE_DIR"

      - name: Prepare run
        if: steps.route.outputs.stage != ''
        id: run
        run: |
          RUN_DIR="$GITHUB_WORKSPACE/.harness/runs/issue-${{ steps.route.outputs.issue }}-${{ steps.route.outputs.stage }}-$GITHUB_RUN_ID"
          mkdir -p "$RUN_DIR"
          echo "dir=$RUN_DIR" >> "$GITHUB_OUTPUT"
          echo "### Issue #${{ steps.route.outputs.issue }} — etapa \`${{ steps.route.outputs.stage }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Claude Code
        if: steps.route.outputs.stage == 'triagem' || steps.route.outputs.stage == 'planejamento' || steps.route.outputs.stage == 'implementacao'
        run: npm install -g @anthropic-ai/claude-code

      # --- stage: implementacao/verificacao need the agent branch and dependencies

      - name: Check out the agent branch
        if: steps.route.outputs.stage == 'verificacao'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet --depth=50 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${{ steps.route.outputs.branch }}"
          git switch --quiet -C "${{ steps.route.outputs.branch }}" FETCH_HEAD

      - name: Install dependencies
        if: steps.route.outputs.stage == 'implementacao' || steps.route.outputs.stage == 'verificacao'
        uses: ./.github/actions/yarn-install

      # --- stages: each writes <run-dir>/facts.json (+ body.md); advance.mjs judges them

      - name: "Stage: triagem"
        if: steps.route.outputs.stage == 'triagem'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$HARNESS_HOME/scripts/delivery-harness/stages/triagem.sh" "${{ steps.route.outputs.issue }}" "${{ steps.run.outputs.dir }}"'

      - name: "Stage: planejamento"
        if: steps.route.outputs.stage == 'planejamento'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$HARNESS_HOME/scripts/delivery-harness/stages/planejamento.sh" "${{ steps.route.outputs.issue }}" "${{ steps.run.outputs.dir }}" "$STATE_DIR"'

      - name: "Stage: implementacao"
        if: steps.route.outputs.stage == 'implementacao'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$HARNESS_HOME/scripts/delivery-harness/stages/implementacao.sh" "${{ steps.route.outputs.issue }}" "${{ steps.run.outputs.dir }}" "$STATE_DIR"'

      - name: "Stage: verificacao"
        if: steps.route.outputs.stage == 'verificacao'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$HARNESS_HOME/scripts/delivery-harness/stages/verificacao.sh" "${{ steps.route.outputs.issue }}" "${{ steps.run.outputs.dir }}" "$STATE_DIR"'

      # Runs even if a stage script crashed: missing facts fail the gate, which
      # retries or blocks — the issue never stays silently stuck in a stage.
      - name: Advance (check exit conditions, record, dispatch next)
        if: always() && steps.route.outputs.stage != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node "$HARNESS_HOME/scripts/delivery-harness/advance.mjs" \
            --issue "${{ steps.route.outputs.issue }}" --stage "${{ steps.route.outputs.stage }}" \
            --facts "${{ steps.run.outputs.dir }}/facts.json" --body "${{ steps.run.outputs.dir }}/body.md"

      - name: Upload run directory
        if: always() && steps.route.outputs.stage != ''
        uses: actions/upload-artifact@v4
        with:
          name: harness-issue-${{ steps.route.outputs.issue }}-${{ steps.route.outputs.stage }}-${{ github.run_id }}
          path: |
            ${{ steps.run.outputs.dir }}
            ${{ env.STATE_DIR }}
          include-hidden-files: true
          retention-days: 30
